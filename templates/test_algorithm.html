<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {

<body>
<div class="container">

<script>
// ═══════════════════════════════════════════════════════════
// داده‌های واقعی از Django
// ═══════════════════════════════════════════════════════════
const REAL_PLACES = {{ places_json|safe }};
const CATEGORIES = {{ categories_json|safe }};

// ═══════════════════════════════════════════════════════════
// CONFIG (کپی از plan.html)
// ═══════════════════════════════════════════════════════════
const CONFIG = {
    center: { lat: 32.3833, lng: 48.4000 },
    maxTripDays: 7,
    dailyTimeMinutes: 8 * 60,
    breakTimeMinutes: 30,
    knnMultiplier: 5,
    cbf: { baseSimilarity: 0.35, weightedScore: 0.65 },
    fuzzyBase: { interest: 30, budget: 20, child: 15, duration: 15, popularity: 10, rating: 10 },
    fuzzyRules: {
        shortTrip: { interest: +15, popularity: -5 },
        longTrip: { duration: +8, rating: +5 },
        lowBudget: { budget: +15, popularity: -5 },
        highBudget: { interest: +5, rating: +5 },
        withChild: { child: +15, duration: +5 }
    },
    ga: {
        popSize: 60, generations: 100, eliteCount: 5,
        crossoverRate: 0.85, mutationRate: 0.25, tournamentSize: 5,
        earlyStopPatience: 20
    }
};

const FA = '۰۱۲۳۴۵۶۷۸۹';
const faNum = s => String(s).replace(/\d/g, d => FA[d]);

// ═══════════════════════════════════════════════════════════
// توابع کمکی
// ═══════════════════════════════════════════════════════════
function calcDistance(lat1, lng1, lat2, lng2) {
    const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function euclideanDistance(a, b) {
    let sum = 0;
    for (let i = 0; i < a.length; i++) sum += (a[i] - b[i]) ** 2;
    return Math.sqrt(sum);
}

function getPlacePolicy(place) {
    const d = place.duration || 60;
    if (d >= 360) return { type: 'full_day', maxCompanions: 1, label: 'روز کامل' };
    if (d >= 240) return { type: 'large', maxCompanions: 2, label: 'بزرگ' };
    if (d >= 180) return { type: 'medium', maxCompanions: 3, label: 'متوسط' };
    if (d >= 90)  return { type: 'small', maxCompanions: 4, label: 'کوچیک' };
    return { type: 'tiny', maxCompanions: 5, label: 'خیلی کوچیک' };
}

// ═══════════════════════════════════════════════════════════
// FUZZY LOGIC
// ═══════════════════════════════════════════════════════════
function triangularMF(x, a, b, c) {
    if (x <= a || x >= c) return 0;
    if (x === b) return 1;
    if (x < b) return (x - a) / (b - a);
    return (c - x) / (c - b);
}

function membershipDuration(days) {
    return {
        short: triangularMF(days, 0, 1, 4),
        medium: triangularMF(days, 2, 4, 6),
        long: triangularMF(days, 5, 7, 10)
    };
}

function membershipBudget(millions) {
    return {
        low: triangularMF(millions, 0, 2, 5),
        medium: triangularMF(millions, 3, 6, 10),
        high: triangularMF(millions, 8, 12, 20)
    };
}

function getFuzzyWeights(duration, hasChild, budgetMax) {
    const durMem = membershipDuration(duration);
    const budMem = membershipBudget(budgetMax / 1_000_000);
    const w = { ...CONFIG.fuzzyBase };
    const R = CONFIG.fuzzyRules;
    w.interest += durMem.short * R.shortTrip.interest;
    w.popularity += durMem.short * R.shortTrip.popularity;
    w.duration += durMem.long * R.longTrip.duration;
    w.rating += durMem.long * R.longTrip.rating;
    w.budget += budMem.low * R.lowBudget.budget;
    w.popularity += budMem.low * R.lowBudget.popularity;
    w.interest += budMem.high * R.highBudget.interest;
    w.rating += budMem.high * R.highBudget.rating;
    if (hasChild) {
        w.child += R.withChild.child;
        w.duration += R.withChild.duration;
    }
    Object.keys(w).forEach(k => { if (w[k] < 0.5) w[k] = 0.5; });
    const total = Object.values(w).reduce((a, b) => a + b, 0);
    Object.keys(w).forEach(k => { w[k] = (w[k] / total) * 100; });
    return w;
}

// ═══════════════════════════════════════════════════════════
// CBF
// ═══════════════════════════════════════════════════════════
const ALL_CATEGORIES = CATEGORIES.map(c => c.name);

function buildPlaceVector(place) {
    const vec = [];
    ALL_CATEGORIES.forEach(cat => vec.push(place.category === cat ? 1 : 0));
    vec.push(Math.min((place.cost || 0) / 5_000_000, 1));
    vec.push(Math.min((place.rating || 3.5) / 5, 1));
    vec.push(place.is_child_friendly ? 1 : 0);
    vec.push(Math.min((place.duration || 60) / 120, 1));
    const distKm = calcDistance(place.lat, place.lng, CONFIG.center.lat, CONFIG.center.lng);
    vec.push(Math.min(distKm / 50, 1));
    return vec;
}

function buildUserVector(userPrefs, fuzzyWeights) {
    const vec = [];
    ALL_CATEGORIES.forEach(cat => vec.push(userPrefs.interests.includes(cat) ? 1 : 0));
    const w = {
        interest: fuzzyWeights.interest / 100,
        budget: fuzzyWeights.budget / 100,
        child: fuzzyWeights.child / 100,
        duration: fuzzyWeights.duration / 100,
        popularity: fuzzyWeights.popularity / 100,
        rating: fuzzyWeights.rating / 100
    };
    const budgetPref = (1 - Math.min(userPrefs.budgetMax / 15_000_000, 1)) * w.budget;
    vec.push(budgetPref);
    vec.push(w.rating);
    vec.push(userPrefs.hasChild ? 1 : w.child);
    vec.push(w.duration);
    vec.push(w.interest * 0.5 + 0.25);
    return vec;
}

function cosineSimilarity(a, b) {
    let dot = 0, normA = 0, normB = 0;
    for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i]; normA += a[i] * a[i]; normB += b[i] * b[i];
    }
    if (normA === 0 || normB === 0) return 0;
    return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

function cbfScoring(places, userPrefs, fuzzyWeights) {
    const userVec = buildUserVector(userPrefs, fuzzyWeights);
    const w = {
        interest: fuzzyWeights.interest / 100,
        budget: fuzzyWeights.budget / 100,
        child: fuzzyWeights.child / 100,
        duration: fuzzyWeights.duration / 100,
        popularity: fuzzyWeights.popularity / 100,
        rating: fuzzyWeights.rating / 100
    };
    return places.map(place => {
        const placeVec = buildPlaceVector(place);
        const baseSim = cosineSimilarity(userVec, placeVec);
        let score = 0;
        const interestMatch = userPrefs.interests.includes(place.category) ? 1 : 0;
        score += interestMatch * w.interest;
        const budgetMax = userPrefs.budgetMax;
        let budgetScore;
        if (place.cost === 0) budgetScore = 1;
        else if (place.cost <= budgetMax * 0.2) budgetScore = 0.9;
        else if (place.cost <= budgetMax * 0.5) budgetScore = 0.7;
        else if (place.cost <= budgetMax) budgetScore = 0.4;
        else budgetScore = 0.1;
        score += budgetScore * w.budget;
        if (userPrefs.hasChild) score += (place.is_child_friendly ? 1 : 0) * w.child;
        else score += 0.5 * w.child;
        let durScore;
        if (place.duration <= 60) durScore = 1;
        else if (place.duration <= 90) durScore = 0.8;
        else if (place.duration <= 120) durScore = 0.6;
        else durScore = 0.3;
        score += durScore * w.duration;
        const reviewsCount = place.views || 0;
        const rating = place.rating || 3.5;
        const popScore = Math.min((reviewsCount / 20) * 0.6 + (rating / 5) * 0.4, 1);
        score += popScore * w.popularity;
        score += Math.min(rating / 5, 1) * w.rating;
        const finalScore01 = baseSim * CONFIG.cbf.baseSimilarity + score * CONFIG.cbf.weightedScore;
        return { ...place, similarity: baseSim, weightedScore: score, score: Math.round(finalScore01 * 100) };
    });
}

// ═══════════════════════════════════════════════════════════
// KNN
// ═══════════════════════════════════════════════════════════
function knnSelection(scoredPlaces, userPrefs, fuzzyWeights, durationDays, budgetMax) {
    const budgetFiltered = scoredPlaces.filter(p => p.cost === 0 || p.cost <= budgetMax * 1.2);
    const userVec = buildUserVector(userPrefs, fuzzyWeights);
    const withDistance = budgetFiltered.map(place => {
        const placeVec = buildPlaceVector(place);
        return { ...place, featureDistance: euclideanDistance(userVec, placeVec) };
    });
    const K = Math.min(withDistance.length, durationDays * CONFIG.knnMultiplier);
    const interestMatched = withDistance.filter(p => userPrefs.interests.includes(p.category)).sort((a, b) => a.featureDistance - b.featureDistance);
    const others = withDistance.filter(p => !userPrefs.interests.includes(p.category)).sort((a, b) => a.featureDistance - b.featureDistance);
    return [...interestMatched, ...others].slice(0, K);
}

// ═══════════════════════════════════════════════════════════
// assignLargePlaces (با دیباگ)
// ═══════════════════════════════════════════════════════════
function assignLargePlaces(places, daysCount, userInterests, logFn) {
    const DAILY_TIME = 8 * 60;
    const LUNCH_TIME = 60;
    const BREAK_TIME = 30;
    
    const fullDayPlaces = places.filter(p => getPlacePolicy(p).type === 'full_day');
    const otherPlaces = places.filter(p => getPlacePolicy(p).type !== 'full_day');
    
    logFn(`🔒 جاذبه‌های «روز کامل» (${fullDayPlaces.length}): ${fullDayPlaces.map(p => `${p.name}(${p.duration}د)`).join(', ') || 'هیچ'}`);
    logFn(`📦 بقیه‌ی جاذبه‌ها (${otherPlaces.length}): ${otherPlaces.map(p => `${p.name}(${p.duration}د)`).join(', ') || 'هیچ'}`);
    
    if (places.length === 0) {
        logFn('⚠️ هیچ جاذبه‌ای وجود نداره');
        return null;
    }
    
    let maxFullDaySlots;
    if (daysCount === 1) maxFullDaySlots = 0;
    else if (daysCount === 2) maxFullDaySlots = 1;
    else maxFullDaySlots = Math.floor(daysCount / 2);
    
    const actualFullDayCount = Math.min(fullDayPlaces.length, maxFullDaySlots);
    
    logFn(`📊 روزها: ${daysCount} | حداکثر اسلات روزکامل: ${maxFullDaySlots} | استفاده می‌کنیم: ${actualFullDayCount}`);
    
    fullDayPlaces.sort((a, b) => (b.score || 0) - (a.score || 0));
    const selectedFullDay = fullDayPlaces.slice(0, actualFullDayCount);
    
    logFn(`🎯 از ${fullDayPlaces.length} جاذبه‌ی روزکامل، ${selectedFullDay.length} تا انتخاب شد`);
    if (fullDayPlaces.length > actualFullDayCount) {
        logFn(`🗑️ ${fullDayPlaces.length - actualFullDayCount} جاذبه‌ی روزکامل کنار گذاشته شد`);
    }
    
    const assignment = Array.from({ length: daysCount }, () => []);
    selectedFullDay.sort((a, b) => (b.duration || 60) - (a.duration || 60));
    
    if (actualFullDayCount === 1 && daysCount >= 2) {
        assignment[0].push(selectedFullDay[0]);
        logFn(`   📍 روز 1: ${selectedFullDay[0].name} (${selectedFullDay[0].duration}د - 🔒 روزکامل)`);
    } else {
        selectedFullDay.forEach((p, i) => {
            const dayIdx = Math.floor(i * daysCount / actualFullDayCount);
            assignment[dayIdx].push(p);
            logFn(`   📍 روز ${dayIdx + 1}: ${p.name} (${p.duration}د - 🔒 روزکامل)`);
        });
    }
    
    otherPlaces.sort((a, b) => (b.score || 0) - (a.score || 0));
    
    let addedSmall = 0;
    let skippedSmall = 0;
    
    otherPlaces.forEach(p => {
        const placeTime = (p.duration || 60) + BREAK_TIME;
        
        let bestDay = -1;
        let minTime = Infinity;
        
        assignment.forEach((day, i) => {
            let dayTime = day.reduce((s, x) => s + (x.duration || 60) + BREAK_TIME, 0);
            if (day.length > 0) dayTime += LUNCH_TIME;
            
            const mainPlace = day[0];
            if (mainPlace) {
                const mainPolicy = getPlacePolicy(mainPlace);
                const companionCount = day.length - 1;
                if (companionCount >= mainPolicy.maxCompanions) return;
            }
            
            const newTime = dayTime + placeTime;
            if (newTime <= DAILY_TIME && dayTime < minTime) {
                minTime = dayTime;
                bestDay = i;
            }
        });
        
        if (bestDay !== -1) {
            assignment[bestDay].push(p);
            addedSmall++;
            logFn(`   ➕ ${p.name} (${p.duration}د) → روز ${bestDay + 1}`);
        } else {
            skippedSmall++;
            logFn(`   ❌ ${p.name} (${p.duration}د) جا نشد`);
        }
    });
    
    logFn(`📊 جاذبه‌های کوچیک: ${addedSmall} اضافه شد، ${skippedSmall} حذف شد`);
    
    return assignment;
}

// ═══════════════════════════════════════════════════════════
// Pipeline اصلی
// ═══════════════════════════════════════════════════════════
function runAlgorithm(interests, options) {
    const logs = [];
    const log = (msg) => logs.push(msg);
    
    log(`══════════════════════════════════════`);
    log(`🚀 شروع پیشنهاد سفر`);
    log(`   علاقه‌مندی‌ها: ${interests.join(', ')}`);
    
    const budgetMax = Number(options.budgetStr.split('-')[1]) || 5_000_000;
    const duration = Math.min(CONFIG.maxTripDays, options.duration || 3);
    const hasChild = options.hasChild || false;
    
    log(`   مدت: ${duration} روز | بودجه: ${budgetMax.toLocaleString()} | کودک: ${hasChild ? 'بله' : 'خیر'}`);
    
    const fuzzyWeights = getFuzzyWeights(duration, hasChild, budgetMax);
    log(`📊 وزن‌های فازی: ${JSON.stringify(fuzzyWeights, null, 0)}`);
    
    const userPrefs = { interests, budgetMax, hasChild };
    const scoredPlaces = cbfScoring(REAL_PLACES, userPrefs, fuzzyWeights);
    const knnSelected = knnSelection(scoredPlaces, userPrefs, fuzzyWeights, duration, budgetMax);
    
    log(`✅ CBF+KNN انتخاب کرد: ${knnSelected.length} جاذبه`);
    
    if (knnSelected.length === 0) {
        log('❌ هیچ جاذبه‌ای پیدا نشد!');
        return { days: [], logs };
    }
    
    const lockedAssignment = assignLargePlaces(knnSelected, duration, interests, log);
    
    if (lockedAssignment) {
        log('✅ از assignLargePlaces استفاده شد');
        return { days: lockedAssignment.filter(d => d.length > 0), logs };
    }
    
    log('📊 GA معمولی');
    return { days: [], logs };
}

// ═══════════════════════════════════════════════════════════
// اعتبارسنجی نتیجه
// ═══════════════════════════════════════════════════════════
function validateResult(days, options) {
    const issues = [];
    const stats = {
        totalDays: days.length,
        totalPlaces: 0,
        overflowDays: 0,
        emptyDays: 0,
        duplicatePlaces: 0,
        maxCompanionViolations: 0
    };
    
    const seenPlaces = new Set();
    
    days.forEach((day, dayIdx) => {
        let dayTime = 0;
        let lastPlace = null;
        
        day.forEach((p, i) => {
            stats.totalPlaces++;
            
            // چک تکراری
            if (seenPlaces.has(p.id)) {
                stats.duplicatePlaces++;
                issues.push(`❌ جاذبه‌ی تکراری: ${p.name} در روز ${dayIdx + 1}`);
            }
            seenPlaces.add(p.id);
            
            // محاسبه زمان
            dayTime += (p.duration || 60);
            if (i > 0) dayTime += 30;
            if (lastPlace) {
                const dist = calcDistance(lastPlace.lat, lastPlace.lng, p.lat, p.lng);
                dayTime += (dist / 10) * 15;
            }
            lastPlace = p;
        });
        
        if (day.length > 0) dayTime += 60; // ناهار
        
        // چک سرریز
        if (dayTime > 8 * 60) {
            stats.overflowDays++;
            issues.push(`⚠️ سرریز زمان: روز ${dayIdx + 1} = ${dayTime} دقیقه (${Math.round(dayTime/60)} ساعت)`);
        }
        
        // چک خالی
        if (day.length === 0) {
            stats.emptyDays++;
            issues.push(`⚠️ روز خالی: روز ${dayIdx + 1}`);
        }
        
        // چک maxCompanions
        if (day.length > 0) {
            const mainPlace = day[0];
            const policy = getPlacePolicy(mainPlace);
            const companionCount = day.length - 1;
            if (companionCount > policy.maxCompanions) {
                stats.maxCompanionViolations++;
                issues.push(`⚠️ نقض maxCompanions: روز ${dayIdx + 1} - ${mainPlace.name} (${policy.label}) با ${companionCount} همراه (حداکثر ${policy.maxCompanions})`);
            }
        }
    });
    
    return { issues, stats };
}

// ═══════════════════════════════════════════════════════════
// اجرای تست
// ═══════════════════════════════════════════════════════════
document.getElementById('runBtn').addEventListener('click', async () => {
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    btn.textContent = '⏳ در حال اجرا...';
    
    const days = parseInt(document.getElementById('testDays').value);
    const budget = document.getElementById('testBudget').value;
    const hasChild = document.getElementById('testChild').value === 'true';
    const interestMode = document.getElementById('testInterest').value;
    
    const interests = interestMode === 'all' 
        ? CATEGORIES.map(c => c.name)
        : [CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)].name];
    
    // اجرای الگوریتم
    const result = runAlgorithm(interests, {
        budgetStr: budget,
        duration: days,
        hasChild: hasChild
    });
    
    // اعتبارسنجی
    const validation = validateResult(result.days, { days, budget, hasChild });
    
    // نمایش
    renderResults(result, validation, { days, budget, hasChild, interests });
    
    btn.disabled = false;
    btn.textContent = '🚀 اجرای تست';
});

// ═══════════════════════════════════════════════════════════
// رندر نتایج
// ═══════════════════════════════════════════════════════════
function renderResults(result, validation, options) {
    const resultsDiv = document.getElementById('results');
    const summaryDiv = document.getElementById('overallSummary');
    
    // رنگ کلی
    const isPass = validation.issues.length === 0;
    const hasWarnings = validation.issues.some(i => i.includes('⚠️'));
    
    // خلاصه کل
    summaryDiv.innerHTML = `
        <div class="overall-summary">
            <div class="overall-stat">
                <span class="value">${faNum(validation.stats.totalDays)}</span>
                <span class="label">📅 روز</span>
            </div>
            <div class="overall-stat">
                <span class="value">${faNum(validation.stats.totalPlaces)}</span>
                <span class="label">📍 جاذبه</span>
            </div>
            <div class="overall-stat">
                <span class="value">${faNum(validation.stats.overflowDays)}</span>
                <span class="label">⚠️ سرریز</span>
            </div>
            <div class="overall-stat">
                <span class="value">${faNum(validation.stats.duplicatePlaces)}</span>
                <span class="label">🔁 تکراری</span>
            </div>
            <div class="overall-stat">
                <span class="value">${faNum(validation.stats.maxCompanionViolations)}</span>
                <span class="label">👥 نقض همراه</span>
            </div>
        </div>
    `;
    
    // کارت تست اصلی
    let html = `
        <div class="test-result ${isPass ? 'pass' : (hasWarnings ? 'warn' : 'fail')}">
            <div class="test-header">
                <div class="test-name">
                    <span>🧪 تست الگوریتم</span>
                </div>
                <div>
                    <span class="test-badge badge-info">${faNum(options.days)} روز</span>
                    <span class="test-badge badge-info">${options.hasChild ? 'با کودک' : 'بدون کودک'}</span>
                    <span class="test-badge ${isPass ? 'badge-pass' : (hasWarnings ? 'badge-warn' : 'badge-fail')}">
                        ${isPass ? '✅ موفق' : (hasWarnings ? '⚠️ هشدار' : '❌ خطا')}
                    </span>
                </div>
            </div>
            
            <div class="test-details">${result.logs.join('\n')}</div>
            
            ${validation.issues.length > 0 ? `
                <div class="test-details" style="margin-top: 12px; background: #fff5f5;">
                    <strong>🔍 مشکلات:</strong>
${validation.issues.join('\n')}
                </div>
            ` : ''}
            
            <div class="day-summary">
                <h4>📋 چیدمان نهایی:</h4>
                ${result.days.map((day, i) => {
                    let dayTime = day.reduce((s, x) => s + (x.duration || 60) + 30, 0);
                    if (day.length > 0) dayTime += 60;
                    const isOver = dayTime > 8 * 60;
                    return `
                        <div class="day-summary-item">
                            <span><strong>روز ${faNum(i + 1)}:</strong> ${day.map(p => p.name).join(' + ') || 'خالی'}</span>
                            <span class="time ${isOver ? 'over' : 'ok'}">${faNum(Math.round(dayTime / 60 * 10) / 10)} ساعت ${isOver ? '⚠️' : '✅'}</span>
                        </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
    
    // تست‌های تک‌تک
    const tests = [
        { name: '🔍 هیچ جاذبه‌ی تکراری نباشه', pass: validation.stats.duplicatePlaces === 0 },
        { name: '⏱️ هیچ روزی سرریز نباشه', pass: validation.stats.overflowDays === 0 },
        { name: '📅 هیچ روزی خالی نباشه', pass: validation.stats.emptyDays === 0 },
        { name: '👥 maxCompanions رعایت بشه', pass: validation.stats.maxCompanionViolations === 0 },
        { name: '📊 حداقل یه جاذبه توی برنامه باشه', pass: validation.stats.totalPlaces > 0 },
        { name: '🎯 تعداد روزها درست باشه', pass: validation.stats.totalDays === options.days }
    ];
    
    html += `<h2>🧪 تست‌های تک‌تک</h2>`;
    
    tests.forEach(test => {
        html += `
            <div class="test-result ${test.pass ? 'pass' : 'fail'}">
                <div class="test-header">
                    <div class="test-name">${test.name}</div>
                    <span class="test-badge ${test.pass ? 'badge-pass' : 'badge-fail'}">
                        ${test.pass ? '✅ PASS' : '❌ FAIL'}
                    </span>
                </div>
            </div>
        `;
    });
    
    resultsDiv.innerHTML = html;
}
